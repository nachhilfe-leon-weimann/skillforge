# The image tag is the deployed version: release-please rewrites the annotated `image:` lines in the
# release commit, so `main` records what prod runs. A rollback never sets an older tag by hand here -
# it restores an earlier tag's whole compose.yml (README, "Rolling back").
services:
  migrate:
    image: ghcr.io/nachhilfe-leon-weimann/skillforge:v0.7.0 # x-release-please-version
    pull_policy: always
    restart: "no"
    env_file:
      - .env
    command: [ "alembic", "upgrade", "head" ]
    networks:
      - dokploy-network

  app:
    image: ghcr.io/nachhilfe-leon-weimann/skillforge:v0.7.0 # x-release-please-version
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Only Traefik reaches the API, over the Docker network; nothing is published on the host.
    expose:
      - "8000"
    networks:
      - dokploy-network

  # Housekeeping: deletes login sessions and one-time tokens 30 days after they expire, and beats for
  # /health. Same image as the app, its own entrypoint, the DB connection; SKIP LOCKED batches
  # make several replicas safe. The image's HEALTHCHECK probes the API on :8000, which this container
  # does not serve - /health reports the worker through its heartbeat instead.
  worker:
    image: ghcr.io/nachhilfe-leon-weimann/skillforge:v0.7.0 # x-release-please-version
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    command: [ "python", "-m", "app.workers.housekeeping" ]
    networks:
      - dokploy-network

# Postgres runs as its own Dokploy database service; it and Traefik are reachable only over this network.
networks:
  dokploy-network:
    external: true
