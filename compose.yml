# The image tag is the deployed version: release-please rewrites the annotated `image:` lines in the
# release commit, so `main` records what prod runs. Change the tag by hand only to roll back (README,
# "Rolling back"), and then on every service.
services:
  migrate:
    image: ghcr.io/nachhilfe-leon-weimann/skillforge:v0.5.0 # x-release-please-version
    pull_policy: always
    restart: "no"
    env_file:
      - .env
    command: [ "alembic", "upgrade", "head" ]

  app:
    image: ghcr.io/nachhilfe-leon-weimann/skillforge:v0.5.0 # x-release-please-version
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  # Housekeeping: deletes login sessions and one-time tokens 30 days after they expire, and beats for
  # /health. Same image as the app, its own entrypoint, the pooled DB connection; SKIP LOCKED batches
  # make several replicas safe. The image's HEALTHCHECK probes the API on :8000, which this container
  # does not serve - /health reports the worker through its heartbeat instead.
  worker:
    image: ghcr.io/nachhilfe-leon-weimann/skillforge:v0.5.0 # x-release-please-version
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    command: [ "python", "-m", "app.workers.housekeeping" ]
