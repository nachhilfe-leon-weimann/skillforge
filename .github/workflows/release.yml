name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR or create release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      sha: ${{ steps.rp.outputs.sha }}

    steps:
      # The App authors the release PR so that CI runs on it; PRs opened with GITHUB_TOKEN get no CI run.
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Keep this the last step: a failure after the release exists would skip build and deploy.
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  image:
    name: Build and publish container image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      push: true
      source_ref: ${{ needs.release-please.outputs.sha }}
      version: ${{ needs.release-please.outputs.version }}
      tag_latest: true
      platforms: "linux/amd64"
    secrets:
      SKILLPLATFORM_READ_TOKEN: ${{ secrets.SKILLPLATFORM_READ_TOKEN }}
    permissions:
      contents: read
      packages: write

  python-client-build:
    name: Build Python client
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Build and smoke-test client
        run: just test-clients

      - name: Upload client distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-client-${{ needs.release-please.outputs.version }}
          path: dist/python/*
          if-no-files-found: error
          retention-days: 7

  python-client:
    name: Publish Python client
    needs:
      - release-please
      - image
      - python-client-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download client distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-client-${{ needs.release-please.outputs.version }}
          path: dist/python

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Publish client to PyPI
        run: uv publish --trusted-publishing always dist/python/*

  deploy:
    name: Deploy
    needs:
      - release-please
      - image
      - python-client
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      sha: ${{ needs.release-please.outputs.sha }}
    secrets: inherit
