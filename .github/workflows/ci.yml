name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  code-quality: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect changes beyond docs
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # No usable base - a manual run, a new branch (all zeros), a force push past the old tip - counts as code.
          if [[ -z "${BASE//0/}" ]] || ! changed=$(git diff --name-only "$BASE...HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$changed"
          # Docs are `docs/**` and Markdown anywhere; an empty diff counts as code.
          if grep -qvE '^docs/|\.md$' <<<"$changed"; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    # A skipped job satisfies the required `check`, so only a docs-only diff skips it. `!cancelled()` and `!= 'false'`
    # run it even when `changes` failed: a broken detection must not wave code through.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: skillforge
          POSTGRES_PASSWORD: skillforge
          POSTGRES_DB: skillforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure skill-platform access
        env:
          SKILLPLATFORM_READ_TOKEN: ${{ secrets.SKILLPLATFORM_READ_TOKEN }}
        run: |
          set -euo pipefail

          git config --global url."https://x-access-token:${SKILLPLATFORM_READ_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run static checks
        run: just static-checks

      - name: Build and smoke-test clients
        run: just test-clients

      - name: Run tests with coverage
        env:
          TEST_DB__URL: postgresql+asyncpg://skillforge:skillforge@localhost:5432/skillforge
        run: just test-coverage

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
          # The report is a convenience, `check` is the required status: a rejected upload (e.g. code
          # quality switched off in the repo settings) must not block every PR and the release.
          fail-on-error: false

      - name: Write coverage summary
        if: always()
        run: test ! -f coverage.xml || uv run python scripts/coverage_summary.py coverage.xml
